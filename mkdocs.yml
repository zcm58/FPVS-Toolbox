site_name: FPVS Toolbox
site_description: User documentation, tool guides, and method references for FPVS Toolbox.
site_url: https://zcm58.github.io/FPVS-Toolbox/
repo_url: https://github.com/zcm58/FPVS-Toolbox
repo_name: zcm58/FPVS-Toolbox
edit_uri: ""
docs_dir: docs/user
site_dir: site
strict: true
theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.expand
    - navigation.indexes
    - toc.integrate
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
    - search.share

plugins:
  - search:
      lang: en

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - footnotes
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installing and Updating: installing-and-updating.md
  - Getting Started:
      - Processing Quick Start: processing-quick-start.md
      - Upgrading from v2.1.2: migration-v3.md
      - Version 3 Release Notes: release-notes-v3.md
  - Tools:
      - Overview: tools/index.md
      - Standard FPVS Screening: tools/statistics.md
      - Free Harmonic Clustering: tools/free-harmonic-clustering.md
      - Sensitivity Analysis: tools/sensitivity-analysis.md
      - SNR Plots: tools/snr-plot-generator.md
      - Scalp Maps: tools/publication-maps.md
      - LORETA Visualizer: tools/loreta-visualizer.md
      - Sequence Figure: tools/sequence-figure.md
      - Individual Detectability: tools/individual-level-detectability.md
  - Reference:
      - Methods and References: reference/index.md
      - EEG Hardware: reference/eeg-hardware.md
      - Source Trigger Maps: reference/source-trigger-maps.md
      - Brain Products Recordings: reference/brain-products.md
      - Preprocessing QC Review: reference/preprocessing-qc-review.md
      - Missing Condition Outputs: reference/missing-condition-outputs.md
      - Spectral Data Files: reference/spectral-data-files.md
      - Methods Reporting Checklists: reference/methods-reporting-checklist.md
