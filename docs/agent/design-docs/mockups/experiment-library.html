  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);

      typeof nextState !== &quot;object&quot; ||

          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||

    if (fileElement != null) {

      fileElement.remove();
      const blobs = new Map();

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;

          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&quot;toolbox-library-refined&quot;);
  const find = (name) =&gt; root.querySelector(&quot;#fp-&quot; + name);
  const picker = find(&quot;preview-state&quot;);
  const progress = find(&quot;progress&quot;);
  const fill = find(&quot;progress-fill&quot;);
  const reducedMotion = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;);
  const phases = {
    library: { title: &quot;Download from OpenFPVS&quot;, detail: &quot;About 250 MB&quot; },
    download: { title: &quot;Downloading dataset…&quot;, detail: &quot;From OpenFPVS&quot; },
    verify: { title: &quot;Verifying experiment files…&quot;, detail: &quot;Checking the archive and file checksums.&quot; },
    setup: { title: &quot;Setting up project…&quot;, detail: &quot;Preparing participants, conditions, and processing settings.&quot; }
  };
  let installed = false;
  let current = &quot;library&quot;;
  let timer = null;

  function stop() {
    if (timer !== null) window.clearTimeout(timer);
    timer = null;
  }

  function save() {
    if (!window.openai?.setWidgetState) return;
    window.openai.setWidgetState({
      modelContent: { previewState: current },
      privateContent: { installed }
    }).catch(() =&gt; {});
  }

  function closeMenu(returnFocus = false) {
    find(&quot;view-menu&quot;).hidden = true;
    find(&quot;view-button&quot;).setAttribute(&quot;aria-expanded&quot;, &quot;false&quot;);
    if (returnFocus) find(&quot;view-button&quot;).focus();
  }

  function announce(message) {
    find(&quot;announcement&quot;).textContent = message;
  }

  function showSurface(name) {
    [&quot;library&quot;, &quot;project&quot;, &quot;welcome&quot;].forEach((surface) =&gt; {
      find(surface).hidden = surface !== name;
    });
    closeMenu();
  }

  function animateStatus() {
    if (reducedMotion.matches) return;
    root.querySelector(&quot;.fp-operation&quot;).animate?.([
      { opacity: .65, transform: &quot;translateY(3px)&quot; },
      { opacity: 1, transform: &quot;translateY(0)&quot; }
    ], { duration: 180, easing: &quot;cubic-bezier(.22,1,.36,1)&quot; });
  }

  function updateProgress(percent) {
    progress.setAttribute(&quot;aria-valuenow&quot;, String(percent));
    fill.style.width = percent + &quot;%&quot;;
    find(&quot;bytes&quot;).textContent = Math.round(250 * percent / 100) + &quot; of ~250 MB&quot;;
  }

  function renderPhase(phase, percent = 46, animate = false) {
    current = phase;
    const busy = phase !== &quot;library&quot;;
    const copy = phases[phase];
    showSurface(&quot;library&quot;);
    picker.value = phase;
    find(&quot;primary&quot;).hidden = busy;
    find(&quot;cancel&quot;).hidden = !busy;
    find(&quot;primary&quot;).textContent = installed ? &quot;Open project&quot; : &quot;Download and open&quot;;
    find(&quot;operation-title&quot;).textContent = phase === &quot;library&quot; &amp;&amp; installed ? &quot;Installed&quot; : copy.title;
    find(&quot;operation-detail&quot;).textContent = phase === &quot;library&quot; &amp;&amp; installed ? &quot;Color Oddball Demo is ready to open.&quot; : copy.detail;
    find(&quot;bytes&quot;).hidden = phase !== &quot;download&quot;;
    progress.hidden = !busy;
    progress.classList.toggle(&quot;is-busy&quot;, busy &amp;&amp; phase !== &quot;download&quot;);
    progress.setAttribute(&quot;aria-label&quot;, copy.title.replace(&quot;…&quot;, &quot;&quot;));
    fill.style.width = &quot;&quot;;
    if (phase === &quot;download&quot;) updateProgress(percent);
    else progress.removeAttribute(&quot;aria-valuenow&quot;);
    if (busy) announce(copy.title);
    if (animate) animateStatus();
  }

  function openProject(moveFocus = true) {
    stop();
    installed = true;
    current = &quot;ready&quot;;
    picker.value = &quot;ready&quot;;
    showSurface(&quot;project&quot;);
    find(&quot;start&quot;).disabled = false;
    find(&quot;ready-message&quot;).textContent = &quot;Ready for processing&quot;;
    announce(&quot;Color Oddball Demo opened. Ready for processing.&quot;);
    if (moveFocus) find(&quot;start&quot;).focus({ preventScroll: true });
  }

  function begin() {
    if (installed) { openProject(); save(); return; }
    stop();
    renderPhase(&quot;download&quot;, 0, true);
    find(&quot;cancel&quot;).focus({ preventScroll: true });
    save();
    const started = performance.now();
    function tick() {
      const percent = Math.min(100, Math.floor((performance.now() - started) / 44));
      updateProgress(percent);
      if (percent &lt; 100) {
        timer = window.setTimeout(tick, 90);
        return;
      }
      renderPhase(&quot;verify&quot;, 0, true);
      timer = window.setTimeout(() =&gt; {
        renderPhase(&quot;setup&quot;, 0, true);
        timer = window.setTimeout(() =&gt; { openProject(); save(); }, 2400);
      }, 2400);
    }
    timer = window.setTimeout(tick, 90);
  }

  function restore(snapshot) {
    const phase = snapshot?.modelContent?.previewState;
    if (![&quot;library&quot;, &quot;download&quot;, &quot;verify&quot;, &quot;setup&quot;, &quot;ready&quot;].includes(phase)) return;
    stop();
    installed = snapshot.privateContent?.installed === true;
    if (phase === &quot;ready&quot;) openProject(false);
    else renderPhase(phase);
  }

  picker.addEventListener(&quot;change&quot;, () =&gt; {
    stop();
    installed = picker.value === &quot;ready&quot;;
    if (installed) openProject(false);
    else renderPhase(picker.value, 46, true);
    save();
  });
  find(&quot;primary&quot;).addEventListener(&quot;click&quot;, begin);
  find(&quot;cancel&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    stop();
    renderPhase(&quot;library&quot;);
    find(&quot;operation-detail&quot;).textContent = &quot;Download canceled. About 250 MB.&quot;;
    announce(&quot;Download canceled.&quot;);
    find(&quot;primary&quot;).focus({ preventScroll: true });
    save();
  });
  find(&quot;view-button&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    const popup = find(&quot;view-menu&quot;);
    if (!popup.hidden) { closeMenu(); return; }
    popup.hidden = false;
    find(&quot;view-button&quot;).setAttribute(&quot;aria-expanded&quot;, &quot;true&quot;);
    find(&quot;menu-library&quot;).focus({ preventScroll: true });
  });
  find(&quot;menu-library&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    closeMenu();
    if ([&quot;download&quot;, &quot;verify&quot;, &quot;setup&quot;].includes(current)) {
      showSurface(&quot;library&quot;);
      find(&quot;cancel&quot;).focus({ preventScroll: true });
      return;
    }
    renderPhase(&quot;library&quot;);
    find(&quot;primary&quot;).focus({ preventScroll: true });
    save();
  });
  find(&quot;menu-home&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    if ([&quot;download&quot;, &quot;verify&quot;, &quot;setup&quot;].includes(current)) {
      closeMenu();
      find(&quot;cancel&quot;).focus({ preventScroll: true });
      return;
    }
    if (installed) openProject();
    else { showSurface(&quot;welcome&quot;); current = &quot;welcome&quot;; }
  });
  find(&quot;view-menu&quot;).addEventListener(&quot;keydown&quot;, (event) =&gt; {
    if (event.key === &quot;Escape&quot;) { event.preventDefault(); closeMenu(true); }
    if (event.key === &quot;ArrowDown&quot; || event.key === &quot;ArrowUp&quot;) {
      event.preventDefault();
      (event.target === find(&quot;menu-home&quot;) ? find(&quot;menu-library&quot;) : find(&quot;menu-home&quot;)).focus();
    }
  });
  root.addEventListener(&quot;click&quot;, (event) =&gt; { if (!event.target.closest(&quot;.fp-view&quot;)) closeMenu(); });
  find(&quot;start&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    find(&quot;ready-message&quot;).textContent = &quot;Processing is the next step in Toolbox.&quot;;
    announce(&quot;Preview complete. Processing is the next step in Toolbox.&quot;);
  });
  window.addEventListener(&quot;openai:set_globals&quot;, (event) =&gt; {
    const saved = event.detail?.globals?.widgetState;
    if (saved) restore(saved);
  });
  renderPhase(&quot;library&quot;);
  restore(window.openai?.widgetState);
})();
&lt;/script&gt;

&lt;script&gt;
(() =&gt; {

    script.src = src;
    script.onload = resolve;

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;

    }

    }

    const request = ++positionRequest;

      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
