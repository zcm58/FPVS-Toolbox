name: Python package

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install pinned Ruff
      run: python -m pip install ruff==0.12.0
    - name: Lint active application and verification code
      run: python -m ruff check src/Main_App src/Tools src/main.py src/config.py tests .agents/scripts

  windows-backend:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: requirements.txt
    - name: Install pinned dependencies
      run: python -m pip install -r requirements.txt
    - name: Verify Windows project persistence and paths
      run: python .agents/scripts/verify.py --scope project-io --tier focused
    - name: Verify backend failure recovery, imports, and spawned workers
      run: python .agents/scripts/verify.py --scope backend-hardening --tier focused

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
      FPVS_ALLOW_QT_TESTS: "1"
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: requirements.txt
    - name: Install Linux Qt runtime dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends libegl1
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Verify Qt runtime imports
      run: python -c "from PySide6 import QtCore, QtGui, QtTest, QtWidgets"
    - name: Verify processing bridge failure recovery and restart
      run: python -m pytest --allow-qt-tests tests/processing/test_mp_runner_bridge_full_pipeline_smoke.py -q
    - name: Test with pytest
      run: python -m pytest --allow-qt-tests --ignore=tests/standalone_scripts -q
