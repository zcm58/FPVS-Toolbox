manual_smoke = [
  "Enable Beta Tools, restart, acknowledge the shared beta notice, then open Scalp Maps at 1280 x 900. Verify the borderless Generate Maps and Advanced Settings panes fit without a page-level scrollbar or a card-within-card frame. On Generate Maps, confirm condition/session selection, map types, the information icon, compact horizontal map-appearance/range controls, status, progress, and Generate Scalp Maps are visible. Confirm fixed BCA starts unchecked with disabled endpoints, then manually enable it and verify the editable 0.0–0.4 values activate; fixed SNR remains enabled. On Advanced Settings, confirm the full-width canonical Excel input remains read-only and unclipped, Group and Refresh remain available, and Output/history plus applicable Figure layout controls use the existing paths and actions. Open View Generation Log during a run, close it, and reopen it; confirm hidden updates and the complete accumulated history remain. In a repeated-session project with exactly two stable groups, confirm Session comparison is the default, session labels include Visit 1/2, the paired-difference option starts unchecked, no fixed-order warning appears in the GUI/help, and generation is enabled. Confirm Figure layout is absent while Map appearance remains on Generate Maps. Switch Compare to Condition (one session) and confirm Figure layout returns without moving appearance controls; switch back and confirm it hides again. In a flat single-group project, confirm Figure layout shows only paired-condition controls; in a flat two-group project, confirm both paired-condition and two-group controls remain available.",
  "Generate the default two-row grid and then opt into the three-row difference grid for representative BCA, SNR, and Z-score maps. At the exact 5.8-inch export width and 100% scale in a US Letter Word page, confirm the canvases are exactly 4.2 and 5.9 inches high respectively; each visible scalp/head outline is vertically centered within its framed cell; no internal condition/metric title, explanatory footer, visit number, or sample-size annotation appears; `(A)` and `(B)` precede the canonical group headers; each canonical session or difference label appears once in the vertical left rail; and the main and optional difference colorbars occupy the right rail without overlap. Confirm a thin neutral outer frame boxes only the two-column map matrix, the center divider separates groups, each row gutter has a full-width divider, all headers/session labels/colorbars remain outside the frame, and nothing clips.",
  "Confirm only the transactional PNG/PDF set is published at the existing base output. Switch to Condition (one session) and confirm legacy condition/group options use only that visit. Also exercise ordinary single-map, paired-condition, and two-group outputs and confirm their appearance, output routing, cancellation, stale harmonic recovery, unreadable-workbook failure, and missing-sensor handling remain unchanged.",
]

