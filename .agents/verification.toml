manual_smoke = ["Open Free Harmonic Clustering Analysis from the default Quick Tools list in a visible 1280x900 Main App session. In a flat project, verify the Comparison card and compact, top-aligned Harmonics card remain in separate columns, there is no page-level scrollbar, one Run Free Harmonic Clustering Analysis click chains preparation/permutations/export on a worker, cancellation remains available, and the concise significant-cluster table omits dense run metadata. In a canonical two-group/two-session project, verify the page automatically shows only Full Repeated-Session Batch; lists both stable groups, both ordered session/phase-at-visit labels with Visit 1/2, all project conditions, and all four prespecified families; omits a repeated fixed-order warning and generic inputs-loaded status; and still fits without clipping or a page-level scrollbar. Confirm the run button remains labeled Run Free Harmonic Clustering Analysis. Open Review recording exclusions, confirm a checked recording can be applied with a blank reason, omitted comments persist as No reason provided, Cancel changes nothing, and accepted exclusions persist in this project. Run the batch, cancel one trial to verify no partial bundle is published, then complete it and verify one bounded result row per condition x family with global, within-family Holm, and full-batch Holm p-values. Confirm the repeated-session workbook/manifest retain complete-pair coverage, missing visits, exclusion reasons, shared harmonic domain, fixed-order warning, and source-relative provenance while QC and source workbooks remain unchanged. Switch projects and confirm exclusions/results from the previous project do not leak into the next; reopening the first project restores its saved exclusions. With missing or stale FullFFT provenance, verify the shared Post-processing Required recovery path. The frozen legacy release gate remains the canonical ACR Neutral Happy n=18 versus n=16 H1 C1/Cz/CPz result with raw tail p approximately .0043; do not treat that receipt as repeated-batch calibration."]

